name: Scroll storytelling checks

on:
  push:
    branches:
      - codex/scroll-storytelling-redesign
      - feat/public-resume
      - feat/project-evidence-v1
      - chore/update-contact-and-trading-name
      - feat/bilingual-portfolio
      - fix/bilingual-static-merge
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-static-bilingual:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/fix/bilingual-static-merge') ||
      (github.event_name == 'pull_request' && github.head_ref == 'fix/bilingual-static-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: fix/bilingual-static-merge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate approved static bilingual pages
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/.run-static-bilingual-generation ]; then
            echo "Static bilingual generation has already completed; skipping write phase."
            exit 0
          fi
          mkdir -p tools
          git show origin/feat/bilingual-portfolio:tools/build_bilingual_portfolio.py > tools/build_bilingual_portfolio.py
          python -m py_compile tools/build_bilingual_portfolio.py
          python tools/build_bilingual_portfolio.py
          python tools/build_bilingual_portfolio.py
          rm -f tools/.run-static-bilingual-generation
          rm -rf tools/__pycache__
          rm -f bilingual-runtime.js trading-evidence-bilingual.js
          rm -f tests/test_bilingual_site_contracts.py
          git diff --check

      - name: Commit generated bilingual site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: stabilize complete static bilingual portfolio"
          git push origin HEAD:fix/bilingual-static-merge

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run contract tests
        run: python -m pytest -q tests

      - name: Compile Python sources
        run: python -m compileall -q tests tools

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check identity-overrides.js
          node --check motion.js
          node --check resume-entry.js
          node --check resume-print.js
          node --check project-evidence.js
          node --check trading-evidence-final.js

      - name: Check forbidden runtime dependencies
        shell: python
        run: |
          from pathlib import Path
          import re

          forbidden_literals = (
              "fonts.googleapis.com",
              "fonts.gstatic.com",
              "cdnjs",
              "jsdelivr",
              "unpkg",
          )
          wheel_listener = re.compile(r"addEventListener\s*\(\s*['\"]wheel")
          mandatory_snap = re.compile(r"scroll-snap-type\s*:\s*y\s+mandatory", re.I)

          failures = []
          for suffix in ("*.html", "*.css", "*.js"):
              for path in Path(".").rglob(suffix):
                  text = path.read_text(encoding="utf-8")
                  lowered = text.lower()
                  if any(item in lowered for item in forbidden_literals):
                      failures.append(f"external runtime dependency: {path}")
                  if wheel_listener.search(text):
                      failures.append(f"wheel listener: {path}")
                  if mandatory_snap.search(text):
                      failures.append(f"mandatory scroll snap: {path}")

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Verify CNAME
        run: test "$(tr -d '\r\n' < CNAME)" = "www.universitydepartment.store"
