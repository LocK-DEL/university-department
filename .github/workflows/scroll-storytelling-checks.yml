name: Scroll storytelling checks

on:
  push:
    branches:
      - codex/scroll-storytelling-redesign
      - feat/public-resume
      - feat/project-evidence-v1
      - chore/update-contact-and-trading-name
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cache-fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/static-cache-busting
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate migration script syntax
        run: python -m py_compile tools/apply_static_cache_fix.py

      - name: Apply static first-render and cache migration
        run: |
          rm -f identity-overrides.js
          python tools/apply_static_cache_fix.py

      - name: Align legacy contracts with versioned assets
        shell: python
        run: |
          from pathlib import Path
          import re

          version = "20260731-1"
          old_title = "BTC多周期行情分析与风控报告系统"
          new_title = "多周期行情分析与风控报告金融交易系统"
          new_url_re = re.compile(r'new URL\("([^"]+\.(?:css|js))", loaderScript\.src\)')
          html_asset_re = re.compile(
              r'((?:href|src)=["\'])(?!https?://|//|mailto:|#)([^"\']+\.(?:css|js))(?:\?[^"\']*)?(["\'])'
          )

          for path in Path("tests").glob("test_*.py"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_title, new_title)
              text = new_url_re.sub(r'versionedUrl("\1")', text)
              text = html_asset_re.sub(
                  lambda match: f'{match.group(1)}{match.group(2)}?v={version}{match.group(3)}',
                  text,
              )
              path.write_text(text, encoding="utf-8")

      - name: Run contract tests
        run: python -m pytest -q tests

      - name: Compile test sources
        run: python -m compileall -q tests

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check motion.js
          node --check resume-entry.js
          node --check resume-print.js
          node --check project-evidence.js
          node --check trading-evidence-final.js

      - name: Check forbidden runtime dependencies
        shell: python
        run: |
          from pathlib import Path
          import re

          forbidden_literals = (
              "fonts.googleapis.com",
              "fonts.gstatic.com",
              "cdnjs",
              "jsdelivr",
              "unpkg",
          )
          wheel_listener = re.compile(r"addEventListener\s*\(\s*['\"]wheel")
          mandatory_snap = re.compile(r"scroll-snap-type\s*:\s*y\s+mandatory", re.I)

          failures = []
          for suffix in ("*.html", "*.css", "*.js"):
              for path in Path(".").rglob(suffix):
                  text = path.read_text(encoding="utf-8")
                  lowered = text.lower()
                  if any(item in lowered for item in forbidden_literals):
                      failures.append(f"external runtime dependency: {path}")
                  if wheel_listener.search(text):
                      failures.append(f"wheel listener: {path}")
                  if mandatory_snap.search(text):
                      failures.append(f"mandatory scroll snap: {path}")

          if failures:
              raise SystemExit("\n".join(failures))

      - name: Verify CNAME
        run: test "$(tr -d '\r\n' < CNAME)" = "www.universitydepartment.store"

      - name: Restore read-only verification workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = subprocess.check_output(
              ["git", "show", "origin/main:.github/workflows/scroll-storytelling-checks.yml"],
              text=True,
          )
          text = text.replace("          node --check identity-overrides.js\n", "")
          Path(".github/workflows/scroll-storytelling-checks.yml").write_text(text, encoding="utf-8")
          PY

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: render final copy and version static assets"
          git push origin HEAD:fix/static-cache-busting
