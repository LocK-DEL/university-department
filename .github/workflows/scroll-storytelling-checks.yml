name: Scroll storytelling checks

on:
  push:
    branches:
      - codex/scroll-storytelling-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run contract tests
        run: python -m pytest -q tests

      - name: Compile test sources
        run: python -m compileall -q tests

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check motion.js

      - name: Check forbidden runtime dependencies
        run: |
          ! grep -RInE 'fonts\.googleapis\.com|fonts\.gstatic\.com|cdnjs|jsdelivr|unpkg|addEventListener\(["'"']wheel|scroll-snap-type:[[:space:]]*y[[:space:]]+mandatory' --include='*.html' --include='*.css' --include='*.js' .

      - name: Verify CNAME
        run: test "$(tr -d '\r\n' < CNAME)" = "www.universitydepartment.store"
